<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no">
    <title>Verdigris</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #05080a; }
      #unity-canvas { position: fixed; left: 0; top: 0; width: 100%; height: 100%; background: #05080a; outline: none; display: block; }
      #loading { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
                 font-family: system-ui, sans-serif; color: #8ff0d0; letter-spacing: 0.2em; background: #05080a; }
      #loading .title { font-size: 2.4rem; font-weight: 700; margin-bottom: 1.2rem; }
      #bar { width: min(320px, 60vw); height: 6px; background: #12222a; border-radius: 3px; overflow: hidden; }
      #bar-full { width: 0%; height: 100%; background: #6ff0c8; }
      #loading .hint { margin-top: 1rem; font-size: 0.8rem; opacity: 0.7; letter-spacing: 0.05em; }
      #warning { position: fixed; left: 0; right: 0; top: 0; display: none; z-index: 5; font-family: system-ui, sans-serif; color: #fff; }
    </style>
  </head>
  <body>
    <canvas id="unity-canvas" tabindex="0"></canvas>
    <div id="loading">
      <div class="title">Verdigris</div>
      <div id="bar"><div id="bar-full"></div></div>
      <div class="hint">Loading… (first start can take a moment)</div>
    </div>
    <div id="warning"></div>
    <script>
      var canvas = document.querySelector("#unity-canvas");

      function showBanner(msg, type) {
        var box = document.querySelector("#warning");
        var div = document.createElement("div");
        div.innerHTML = msg;
        div.style = "padding: 10px; background: " + (type == "error" ? "#c00" : "#a80");
        box.appendChild(div);
        box.style.display = "block";
        if (type != "error") setTimeout(function () { box.removeChild(div); box.style.display = box.children.length ? "block" : "none"; }, 5000);
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/webgl.loader.js";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/webgl.data.unityweb",
        frameworkUrl: buildUrl + "/webgl.framework.js.unityweb",
        codeUrl: buildUrl + "/webgl.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "Miluminati",
        productName: "Verdigris",
        productVersion: "1.0",
        showBanner: showBanner,
        devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2),
      };

      // The game fills whatever box it is embedded in; the camera keeps its height, so any aspect ratio works.
      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = function () {
        createUnityInstance(canvas, config, function (progress) {
          document.querySelector("#bar-full").style.width = (100 * progress) + "%";
        }).then(function (instance) {
          document.querySelector("#loading").style.display = "none";
          canvas.focus();
          // Keyboard focus inside an iframe: take it on any click.
          window.addEventListener("pointerdown", function () { canvas.focus(); window.focus(); });
          window.parent.postMessage({ type: "ready" }, "*");
        }).catch(function (message) {
          showBanner(String(message), "error");
        });
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
